name: CI/CD Pipeline

on:
  push:
    branches: [ Master ]
  pull_request:
    branches: [ Master ]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend_django/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd backend_django
        pip install -r requirements.txt
    
    - name: Run Django tests
      run: |
        cd backend_django
        python manage.py test
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
    
    - name: Check for migrations
      run: |
        cd backend_django
        python manage.py makemigrations --check --dry-run
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run tests
      run: |
        cd frontend
        npm test -- --watchAll=false --coverage
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
      env:
        REACT_APP_API_URL: https://test-backend.railway.app

  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install flake8
      run: pip install flake8
    
    - name: Lint Python code
      run: |
        cd backend_django
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  # Deploy notification (runs only after all tests pass)
  deploy-notification:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Master'
    
    steps:
    - name: Notify deployment
      run: |
        echo "✅ All tests passed!"
        echo "🚀 Vercel and Railway will auto-deploy"
        echo "Frontend: https://the-queens-store.vercel.app"
        echo "Backend: Check Railway dashboard"

